<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบงานบริการตัดหญ้า</title>
<link href="https://script.google.com/macros/s/AKfycbxlGBsFShdPlQeVJSeUl94r4d9vLCDXtJ9fGprEDrkyAyxDztbv8ZkCU2dSeFvWLDs/exec" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* คงสไตล์เดิมทั้งหมดของคุณไว้เพื่อให้หน้าตาเหมือนเดิม */
:root { --teal-dark:#00695C;--teal:#26A69A;--teal-light:#4DB6AC;--teal-pale:#E0F2F1; --yellow-bg:#FFFDE7; --gray-800:#263238; }
/* ... (ใส่ CSS เดิมของคุณไว้ที่นี่ทั้งหมด) ... */
</style>
</head>
<body>
<div class="logo-text">
  <h1>ระบบงานบริการตัดหญ้า</h1>
  <p>พัฒนาโดย : พ่อมดตะนอย</p>
</div>

<nav>
  <div class="nav-group">
    <div class="nav-group-label">หลัก</div>
    <div class="nav-item active" onclick="switchPage('dashboard')"><div class="nav-icon"><i class="fas fa-chart-pie"></i></div><span>แดชบอร์ด</span></div>
    <div class="nav-item" onclick="switchPage('checkin')"><div class="nav-icon"><i class="fas fa-user-clock"></i></div><span>บันทึกเริ่มงาน</span></div>
    <div class="nav-item" onclick="switchPage('calendar')"><div class="nav-icon"><i class="fas fa-calendar-alt"></i></div><span>ปฏิทินงาน</span></div>
    <div class="nav-item" onclick="switchPage('schedule')"><div class="nav-icon"><i class="fas fa-table"></i></div><span>ตารางงาน</span></div>
  </div>
  <div class="nav-group">
    <div class="nav-group-label">รายงาน</div>
    <div class="nav-item" onclick="switchPage('logs')"><div class="nav-icon"><i class="fas fa-history"></i></div><span>บันทึกการทำงาน</span></div>
    <div class="nav-item" onclick="switchPage('stats')"><div class="nav-icon"><i class="fas fa-bar-chart"></i></div><span>สถิติผลงาน</span></div>
    <div class="nav-item" onclick="switchPage('report')"><div class="nav-icon"><i class="fas fa-file-pdf"></i></div><span>รายงาน PDF</span></div>
  </div>
  <div class="nav-group">
    <div class="nav-group-label">จัดการ</div>
    <div class="nav-item" onclick="switchPage('teachers')"><div class="nav-icon"><i class="fas fa-users"></i></div><span>ข้อมูลถนน</span></div>
    <div class="nav-item" onclick="switchPage('addschedule')"><div class="nav-icon"><i class="fas fa-calendar-plus"></i></div><span>เพิ่มตารางงาน</span></div>
    <div class="nav-item" onclick="switchPage('settings')"><div class="nav-icon"><i class="fas fa-cog"></i></div><span>ตั้งค่าระบบ</span></div>
  </div>
</nav>

<div class="form-grid form-grid-2">
  <div class="form-group"><label class="form-label"><i class="fas fa-id-card"></i> รหัสถนน</label><input class="form-control" id="ciTeacherId" placeholder="รหัสถนน" required></div>
  <div class="form-group"><label class="form-label"><i class="fas fa-road"></i> ชื่อถนน</label><input class="form-control" id="ciTeacherName" placeholder="ชื่อถนน" required></div>
</div>

<script>
// ตรวจสอบให้แน่ใจว่าฟังก์ชันยังเรียกใช้ ID เดิมที่ถูกต้อง
// หมายเหตุ: โค้ดในส่วน script ของเดิมยังใช้งานได้ปกติ 
// แต่ต้องแก้ข้อความที่แสดงใน log/table เพื่อให้ผู้ใช้ไม่งง
</script>
</body>
</html>
